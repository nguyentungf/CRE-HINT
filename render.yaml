# Render.com Blueprint Specification
# Xem tài liệu: https://render.com/docs/blueprint-spec
version: "1"

services:
  # ===================================================
  # 1. BACKEND SERVICE (Node.js + Express + SQLite)
  # ===================================================
  - type: web
    name: cre-hint-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true

  # ===================================================
  # 2. FRONTEND STATIC SITE (React + Vite SPA)
  # ===================================================
  - type: web
    name: cre-hint-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cre-hint-backend
          property: url
